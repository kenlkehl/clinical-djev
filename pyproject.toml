[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clinical-djev"
version = "0.1.0"
description = "Batched Jev-style clinical extraction with DiffusionGemma and vLLM"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1.6,<4",
  "packaging>=24",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "transformers>=5.8,<6",
  "uvicorn>=0.34,<1",
]

[project.scripts]
djev = "djev.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/djev"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "examples", "README.md", "VALIDATION.md", "NOTICE", "pyproject.toml", "uv.lock", ".python-version", ".env.example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The command-line batch runner uses bounded synchronous JSONL file operations;
# timeout configures HTTP transport, not an application-level task deadline.
"src/djev/batch.py" = ["ASYNC109", "ASYNC240"]
"tests/*" = ["ASYNC240"]
